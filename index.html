<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAN Party</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Tahoma, "Trebuchet MS", Arial, sans-serif;
      background:
        linear-gradient(rgba(0, 8, 25, .52), rgba(0, 0, 0, .68)),
        url("https://images4.alphacoders.com/274/thumb-1920-274278.jpg") center center / cover no-repeat fixed;
      background-attachment: fixed;
      padding: 25px 15px 60px;
      position: relative;
    }
    body::before {
      content: "";
      position: fixed;
      inset: -6%;
      z-index: -1;
      background: url("https://images4.alphacoders.com/274/thumb-1920-274278.jpg") center center / cover no-repeat;
      transform: scale(1.08);
      filter: saturate(.85) contrast(1.1) brightness(.7);
      animation: spaceDrift 24s ease-in-out infinite alternate;
    }
    @keyframes spaceDrift {
      from { transform: scale(1.08) translate3d(-1.5%, -1%, 0); }
      to   { transform: scale(1.13) translate3d(1.5%, 1%, 0); }
    }
    .content {
      width: min(520px, 92vw);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    .gif-frame {
      width: 100%;
      position: relative;
      overflow: hidden;
      border: none;
      border-radius: 12px;
      background: #fff;
      box-shadow: none;
    }
    .gif-top { aspect-ratio: 100 / 43; }
    .gif-bottom { aspect-ratio: 2 / 1; }
    .gif-frame iframe,
    .gif-frame img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      object-fit: cover;
      pointer-events: none;
      user-select: none;
    }
    .xp-button {
      min-width: 210px;
      padding: 10px 22px;
      color: #111;
      font-size: 14px;
      font-weight: bold;
      font-family: Tahoma, Arial, sans-serif;
      background: linear-gradient(to bottom, #fff 0%, #f7f7f7 42%, #e3e3e3 55%, #f5f5f5 100%);
      border: 2px solid #003c74;
      border-radius: 4px;
      box-shadow: inset 1px 1px 0 #fff, inset -1px -1px 0 #b6b6b6, 1px 2px 3px rgba(0,0,0,.35);
      cursor: pointer;
    }
    .xp-button:hover {
      border-color: #e59700;
      box-shadow: inset 0 0 0 2px #ffcf65, 1px 2px 3px rgba(0,0,0,.35);
    }
    .xp-button:active {
      background: linear-gradient(to bottom, #ddd, #f3f3f3);
      box-shadow: inset 2px 2px 3px #999;
      transform: translateY(1px);
    }
  
    .login-overlay {
      position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center;
      background: rgba(0, 5, 15, .9); backdrop-filter: blur(7px);
    }
    .login-panel {
      width: min(390px, 90vw); padding: 24px; text-align: center; color: #bdeaff;
      background: linear-gradient(145deg, rgba(4,18,35,.97), rgba(8,38,62,.97));
      border: 1px solid #55cfff; border-radius: 10px;
      box-shadow: 0 0 18px rgba(62,201,255,.65), inset 0 0 25px rgba(20,111,160,.28);
    }
    .login-panel h1 { margin: 0 0 5px; font-size: 24px; letter-spacing: 3px; color: #e3f8ff; text-shadow: 0 0 8px #39bfff; }
    .login-panel p { margin: 0 0 20px; font-size: 12px; color: #77cde9; letter-spacing: 2px; }
    .login-panel input {
      width: 100%; margin: 6px 0; padding: 10px 12px; color: #d9f7ff; background: #020b14;
      border: 1px solid #267ca1; border-radius: 4px; outline: none; font-family: Tahoma, Arial, sans-serif;
    }
    .login-panel input:focus { border-color: #67d8ff; box-shadow: 0 0 7px rgba(77,211,255,.55); }
    .login-button {
      width: 100%; margin-top: 12px; padding: 10px; cursor: pointer; font-weight: bold; letter-spacing: 1px;
      color: #dff8ff; background: linear-gradient(#176b91, #073852); border: 1px solid #5ed6ff; border-radius: 4px;
    }
    .login-button:hover { background: linear-gradient(#218bb8, #0a4969); }
    .login-error { height: 18px; margin-top: 10px; color: #ff6b6b; font-size: 12px; }
    .site-content.locked { visibility: hidden; }
  </style>
</head>
<body>
  <div class="login-overlay" id="loginOverlay">
    <form class="login-panel" id="loginForm">
      <h1>LAN PARTY</h1>
      <p>SECURE TERRAN NETWORK</p>
      <input id="loginName" type="text" autocomplete="username" placeholder="LOGIN" autofocus>
      <input id="loginPassword" type="password" autocomplete="current-password" placeholder="PASSWORD">
      <button class="login-button" type="submit">AUTHENTICATE</button>
      <div class="login-error" id="loginError"></div>
    </form>
  </div>
  <div class="site-content locked" id="siteContent">
  <main class="content">
    <div class="gif-frame gif-top">
      <img src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExNGMzaWNxc2x0ZmtkNzlkMWxpMXE4Z3hxcDVkNGpkY3ZhY2R6a3VwdiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/rRxOR2sKBzDJ6/giphy.gif" alt="">
    </div>

    <button class="xp-button" type="button">FILES YOU NEED</button>

    <div class="gif-frame gif-bottom">
      <img src="https://media.giphy.com/media/xUPGcuHQiGu7XF2N9K/giphy.gif" alt="">
    </div>
  </main>
  </div>
  <script>
    const overlay = document.getElementById('loginOverlay');
    const content = document.getElementById('siteContent');
    const form = document.getElementById('loginForm');
    const error = document.getElementById('loginError');

    if (sessionStorage.getItem('lanPartyAccess') === 'granted') {
      overlay.style.display = 'none';
      content.classList.remove('locked');
    }

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      const login = document.getElementById('loginName').value;
      const password = document.getElementById('loginPassword').value;
      if (login === 'as' && password === 'gejus') {
        sessionStorage.setItem('lanPartyAccess', 'granted');
        overlay.style.display = 'none';
        content.classList.remove('locked');
      } else {
        error.textContent = 'ACCESS DENIED';
        document.getElementById('loginPassword').value = '';
      }
    });
  </script>
</body>
</html>
