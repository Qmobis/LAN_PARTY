<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAN Party</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Tahoma, "Trebuchet MS", Arial, sans-serif;
      background: linear-gradient(to bottom, #245edb 0%, #3a8cf4 12%, #6fb6ff 48%, #4f9cf0 72%, #245edb 100%);
      overflow: hidden;
    }
    body::after {
      content: "";
      position: fixed;
      left: 0; right: 0; bottom: 0;
      height: 38px;
      background: linear-gradient(to bottom, #3168d5 0%, #2456c6 12%, #1d4db7 55%, #173e9e 100%);
      border-top: 2px solid #5c91ec;
      box-shadow: 0 -1px 2px rgba(0,0,0,.35);
    }
    .xp-button {
      position: relative;
      z-index: 1;
      min-width: 210px;
      padding: 10px 22px;
      color: #111;
      font-size: 14px;
      font-weight: bold;
      font-family: Tahoma, Arial, sans-serif;
      background: linear-gradient(to bottom, #fff 0%, #f7f7f7 42%, #e3e3e3 55%, #f5f5f5 100%);
      border: 2px solid #003c74;
      border-radius: 4px;
      box-shadow:
        inset 1px 1px 0 #fff,
        inset -1px -1px 0 #b6b6b6,
        1px 2px 3px rgba(0,0,0,.35);
      cursor: pointer;
    }
    .xp-button:hover {
      border-color: #e59700;
      box-shadow: inset 0 0 0 2px #ffcf65, 1px 2px 3px rgba(0,0,0,.35);
    }
    .xp-button:active {
      background: linear-gradient(to bottom, #ddd, #f3f3f3);
      box-shadow: inset 2px 2px 3px #999;
      transform: translateY(1px);
    }
  </style>
</head>
<body>
  <button class="xp-button" type="button">FILES YOU NEED</button>
</body>
</html>
