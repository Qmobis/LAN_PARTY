<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAN Party</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Tahoma, "Trebuchet MS", Arial, sans-serif;
      background:
        linear-gradient(rgba(0, 8, 25, .52), rgba(0, 0, 0, .68)),
        url("https://images4.alphacoders.com/274/thumb-1920-274278.jpg") center center / cover no-repeat fixed;
      background-attachment: fixed;
      padding: 25px 15px 60px;
      position: relative;
    }
    body::before {
      content: "";
      position: fixed;
      inset: -6%;
      z-index: -1;
      background: url("https://images4.alphacoders.com/274/thumb-1920-274278.jpg") center center / cover no-repeat;
      transform: scale(1.08);
      filter: saturate(.85) contrast(1.1) brightness(.7);
      animation: spaceDrift 24s ease-in-out infinite alternate;
    }
    @keyframes spaceDrift {
      from { transform: scale(1.08) translate3d(-1.5%, -1%, 0); }
      to   { transform: scale(1.13) translate3d(1.5%, 1%, 0); }
    }
    .content {
      width: min(520px, 92vw);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    .gif-frame {
      width: 100%;
      position: relative;
      overflow: hidden;
      border: 3px solid #003c74;
      border-radius: 5px;
      background: #fff;
      box-shadow: 2px 3px 7px rgba(0,0,0,.45);
    }
    .gif-top { aspect-ratio: 100 / 43; }
    .gif-bottom { aspect-ratio: 2 / 1; }
    .gif-frame iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .xp-button {
      min-width: 210px;
      padding: 10px 22px;
      color: #111;
      font-size: 14px;
      font-weight: bold;
      font-family: Tahoma, Arial, sans-serif;
      background: linear-gradient(to bottom, #fff 0%, #f7f7f7 42%, #e3e3e3 55%, #f5f5f5 100%);
      border: 2px solid #003c74;
      border-radius: 4px;
      box-shadow: inset 1px 1px 0 #fff, inset -1px -1px 0 #b6b6b6, 1px 2px 3px rgba(0,0,0,.35);
      cursor: pointer;
    }
    .xp-button:hover {
      border-color: #e59700;
      box-shadow: inset 0 0 0 2px #ffcf65, 1px 2px 3px rgba(0,0,0,.35);
    }
    .xp-button:active {
      background: linear-gradient(to bottom, #ddd, #f3f3f3);
      box-shadow: inset 2px 2px 3px #999;
      transform: translateY(1px);
    }
  </style>
</head>
<body>
  <main class="content">
    <div class="gif-frame gif-top">
      <iframe src="https://giphy.com/embed/rRxOR2sKBzDJ6" allowfullscreen title="GIPHY animation"></iframe>
    </div>

    <button class="xp-button" type="button">FILES YOU NEED</button>

    <div class="gif-frame gif-bottom">
      <iframe src="https://giphy.com/embed/xUPGcuHQiGu7XF2N9K" allowfullscreen title="StarCraft Brood War GIPHY animation"></iframe>
    </div>
  </main>
</body>
</html>
